# Fixed project name: every copy of Sparks on this PC (old or new folder) uses the same database.
name: sparks

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparks
      POSTGRES_PASSWORD: sparks
      POSTGRES_DB: sparks
    ports:
      # Its own port, so it doesn't clash with another PostgreSQL on the usual 5432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
